<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>UHabitacional · Prototipo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ====================================================================
   UHABITACIONAL — Prototipo navegable
   Paleta C · Bosque Urbano · Logo: Bloques Residenciales
   ==================================================================== */

/* ---------- Tokens ---------- */
:root{
  --primary:#2D4A3E;
  --primary-700:#1F3528;
  --primary-100:#D6E1D7;
  --primary-50:#EAF0E8;
  --accent:#CB6843;
  --accent-700:#A4502F;
  --accent-100:#F4DCCE;
  --soft:#A8C09A;

  --bg:#FBFAF7;
  --surface:#FFFFFF;
  --ink:#1A1A1A;
  --muted:#6E6E6E;
  --muted-2:#9A9A98;
  --line:rgba(0,0,0,.08);
  --line-strong:rgba(0,0,0,.14);

  --danger:#C0392B;
  --danger-100:#FBE6E2;
  --success:#2D6A4F;
  --success-100:#D6EBDD;
  --warning:#B7791F;

  --radius:12px;
  --radius-lg:18px;
  --radius-pill:999px;
  --shadow-sm:0 1px 2px rgba(0,0,0,.04), 0 1px 6px rgba(0,0,0,.04);
  --shadow-md:0 12px 30px -16px rgba(0,0,0,.18);
  --shadow-lg:0 30px 60px -24px rgba(0,0,0,.25);

  --t-fast:.15s ease;
  --t-base:.22s ease;
}

/* ---------- Reset ---------- */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:'Plus Jakarta Sans','Inter',system-ui,-apple-system,sans-serif;
  background:var(--bg);
  color:var(--ink);
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
a{color:inherit;text-decoration:none}
button{font:inherit;cursor:pointer;border:0;background:transparent;color:inherit}
input,select,textarea{font:inherit;color:inherit}
ul{list-style:none}

/* ---------- Demo bar (solo prototipo) ---------- */
.demo-bar{
  position:fixed;top:0;left:0;right:0;z-index:100;
  background:#1A1A1A;color:#fff;padding:8px 16px;
  display:flex;align-items:center;gap:14px;font-size:12px;
  border-bottom:1px solid #000;
}
.demo-bar .label{opacity:.65;letter-spacing:.06em;text-transform:uppercase;font-weight:600}
.demo-bar .role-switch{display:flex;gap:4px}
.demo-bar .role-switch button{
  padding:5px 10px;border-radius:999px;background:rgba(255,255,255,.08);
  color:#fff;font-size:11px;font-weight:600;letter-spacing:.03em;
  transition:background var(--t-fast);
}
.demo-bar .role-switch button:hover{background:rgba(255,255,255,.18)}
.demo-bar .role-switch button.active{background:var(--accent);color:#fff}
.demo-bar .right{margin-left:auto;display:flex;gap:14px;align-items:center;opacity:.7}

/* ---------- App shell ---------- */
#app{padding-top:36px;min-height:100vh}
.layout{display:grid;grid-template-columns:248px 1fr;min-height:calc(100vh - 36px)}
.layout.no-sidebar{grid-template-columns:1fr}

/* ---------- Sidebar ---------- */
.sidebar{
  background:var(--surface);border-right:1px solid var(--line);
  padding:24px 16px;display:flex;flex-direction:column;gap:6px;
  position:sticky;top:36px;height:calc(100vh - 36px);overflow-y:auto;
}
.brand{display:flex;align-items:center;gap:10px;padding:6px 10px;margin-bottom:20px}
.brand-mark{flex-shrink:0}
.brand-name{font-weight:800;font-size:17px;letter-spacing:-.01em}
.brand-name .accent{color:var(--accent)}
.nav-section{font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--muted-2);padding:14px 12px 6px}
.nav-item{
  display:flex;align-items:center;gap:10px;
  padding:9px 12px;border-radius:10px;font-size:14px;font-weight:500;
  color:#3a3a36;transition:background var(--t-fast),color var(--t-fast);
  cursor:pointer;
}
.nav-item:hover{background:var(--primary-50);color:var(--primary)}
.nav-item.active{background:var(--primary);color:#fff}
.nav-item.active svg{color:#fff}
.nav-item svg{color:var(--muted);flex-shrink:0;transition:color var(--t-fast)}
.nav-item:hover svg{color:var(--primary)}
.sidebar-foot{margin-top:auto;padding:12px 6px;border-top:1px solid var(--line)}
.user-chip{
  display:flex;align-items:center;gap:10px;padding:10px;border-radius:10px;
  transition:background var(--t-fast);
}
.user-chip:hover{background:var(--bg)}
.avatar{
  width:34px;height:34px;border-radius:50%;background:var(--primary);color:#fff;
  display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;
}
.user-meta{font-size:13px;line-height:1.2}
.user-meta small{display:block;color:var(--muted);font-size:11px;margin-top:2px}
.logout-btn{
  width:100%;margin-top:6px;display:flex;align-items:center;gap:8px;
  padding:9px 10px;border-radius:10px;color:var(--danger);font-size:13px;font-weight:600;
  transition:background var(--t-fast);
}
.logout-btn:hover{background:var(--danger-100)}

/* ---------- Topbar ---------- */
.topbar{
  background:var(--surface);border-bottom:1px solid var(--line);
  padding:14px 32px;display:flex;align-items:center;gap:18px;
  position:sticky;top:36px;z-index:50;
}
.breadcrumb{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);flex:1;min-width:0}
.breadcrumb .crumb{padding:3px 0;transition:color var(--t-fast)}
.breadcrumb .crumb.link{cursor:pointer}
.breadcrumb .crumb.link:hover{color:var(--primary)}
.breadcrumb .crumb.current{color:var(--ink);font-weight:600}
.breadcrumb .sep{color:var(--muted-2);font-size:11px}
.topbar-actions{display:flex;align-items:center;gap:10px}
.icon-btn{
  width:36px;height:36px;border-radius:10px;display:inline-flex;align-items:center;justify-content:center;
  color:var(--muted);transition:background var(--t-fast),color var(--t-fast);
}
.icon-btn:hover{background:var(--bg);color:var(--ink)}

/* ---------- Main content ---------- */
.content{padding:32px 40px 64px;max-width:1400px;width:100%}
.page-header{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:28px;flex-wrap:wrap}
.page-title{font-size:28px;font-weight:700;letter-spacing:-.015em}
.page-subtitle{color:var(--muted);font-size:14px;margin-top:4px;max-width:520px}

/* ---------- Buttons ---------- */
.btn{
  display:inline-flex;align-items:center;gap:8px;
  padding:10px 18px;border-radius:10px;font-size:14px;font-weight:600;
  transition:transform var(--t-fast),background var(--t-fast),box-shadow var(--t-fast),color var(--t-fast);
  white-space:nowrap;
}
.btn:active{transform:translateY(1px)}
.btn-primary{background:var(--primary);color:#fff}
.btn-primary:hover{background:var(--primary-700)}
.btn-accent{background:var(--accent);color:#fff}
.btn-accent:hover{background:var(--accent-700)}
.btn-ghost{background:transparent;color:var(--ink);border:1px solid var(--line-strong)}
.btn-ghost:hover{background:var(--bg)}
.btn-danger{background:var(--danger);color:#fff}
.btn-danger:hover{background:#9a2c1f}
.btn-sm{padding:7px 12px;font-size:13px}
.btn-icon{width:34px;height:34px;padding:0;justify-content:center;border-radius:8px}

/* ---------- Cards ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-lg);padding:24px}
.card.flat{box-shadow:var(--shadow-sm)}

/* ---------- Home cards ---------- */
.welcome-strip{
  background:linear-gradient(120deg,var(--primary) 0%, #1F3528 100%);
  color:#fff;border-radius:var(--radius-lg);padding:28px 32px;margin-bottom:28px;
  display:flex;justify-content:space-between;align-items:center;gap:24px;flex-wrap:wrap;
  position:relative;overflow:hidden;
}
.welcome-strip::after{
  content:"";position:absolute;right:-40px;top:-40px;width:240px;height:240px;
  background:radial-gradient(circle at center,rgba(168,192,154,.25),transparent 60%);
  pointer-events:none;
}
.welcome-strip h2{font-size:24px;font-weight:700;letter-spacing:-.01em;margin-bottom:6px}
.welcome-strip p{opacity:.8;max-width:520px;font-size:14px}
.welcome-strip .stat{display:flex;gap:24px;position:relative;z-index:1}
.welcome-strip .stat div{text-align:right}
.welcome-strip .stat .num{font-size:26px;font-weight:700;letter-spacing:-.01em}
.welcome-strip .stat .lbl{font-size:11px;opacity:.7;text-transform:uppercase;letter-spacing:.1em}

.home-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:20px}
.home-card{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-lg);
  padding:24px;cursor:pointer;transition:transform var(--t-base),box-shadow var(--t-base),border-color var(--t-base);
  display:flex;flex-direction:column;gap:14px;min-height:180px;
}
.home-card:hover{transform:translateY(-4px);box-shadow:var(--shadow-md);border-color:transparent}
.home-card .ico{
  width:46px;height:46px;border-radius:12px;background:var(--primary-50);color:var(--primary);
  display:inline-flex;align-items:center;justify-content:center;
}
.home-card.accent .ico{background:var(--accent-100);color:var(--accent-700)}
.home-card h3{font-size:17px;font-weight:700;letter-spacing:-.01em}
.home-card p{font-size:13px;color:var(--muted);line-height:1.5;flex:1}
.home-card .arrow{align-self:flex-end;color:var(--muted);transition:color var(--t-fast),transform var(--t-fast)}
.home-card:hover .arrow{color:var(--accent);transform:translateX(4px)}

/* ---------- Tables ---------- */
.table-toolbar{display:flex;gap:12px;align-items:center;margin-bottom:18px;flex-wrap:wrap}
.search-input{
  display:flex;align-items:center;gap:8px;padding:9px 14px;background:var(--surface);
  border:1px solid var(--line);border-radius:10px;min-width:280px;flex:1;max-width:380px;
  transition:border-color var(--t-fast);
}
.search-input:focus-within{border-color:var(--primary)}
.search-input svg{color:var(--muted);flex-shrink:0}
.search-input input{border:0;outline:0;background:transparent;flex:1;font-size:14px}
.filter-pill{
  display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:999px;
  border:1px solid var(--line-strong);font-size:13px;font-weight:500;background:var(--surface);
  cursor:pointer;transition:background var(--t-fast),border-color var(--t-fast);
}
.filter-pill:hover{border-color:var(--primary)}
.filter-pill.active{background:var(--primary);color:#fff;border-color:var(--primary)}
.filter-pill select{border:0;background:transparent;outline:0;font-size:13px;color:inherit;cursor:pointer}

.table-wrap{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-lg);overflow:hidden}
table{width:100%;border-collapse:collapse;font-size:14px}
thead th{
  text-align:left;padding:14px 18px;background:#FAFAF7;color:var(--muted);
  font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;
  border-bottom:1px solid var(--line);
}
tbody td{padding:14px 18px;border-bottom:1px solid var(--line);vertical-align:middle}
tbody tr:last-child td{border-bottom:0}
tbody tr{transition:background var(--t-fast)}
tbody tr:hover{background:var(--bg)}
.cell-id{font-family:'Inter',monospace;font-size:12px;color:var(--muted)}
.cell-strong{font-weight:600}
.cell-actions{text-align:right;white-space:nowrap}
.cell-actions .btn{margin-left:6px}
.pill{display:inline-block;padding:3px 10px;border-radius:999px;font-size:11px;font-weight:600;letter-spacing:.02em}
.pill-success{background:var(--success-100);color:var(--success)}
.pill-neutral{background:#E9E7E2;color:#5a5852}
.pill-accent{background:var(--accent-100);color:var(--accent-700)}
.pill-soft{background:var(--primary-100);color:var(--primary)}
.pill-danger{background:var(--danger-100);color:var(--danger)}

.table-foot{
  padding:14px 18px;display:flex;justify-content:space-between;align-items:center;
  color:var(--muted);font-size:13px;border-top:1px solid var(--line);background:#FAFAF7;
}
.pagination{display:flex;gap:4px}
.pagination button{
  width:30px;height:30px;border-radius:8px;display:inline-flex;align-items:center;justify-content:center;
  color:var(--muted);font-size:13px;font-weight:600;
}
.pagination button:hover{background:var(--surface)}
.pagination button.active{background:var(--primary);color:#fff}

/* ---------- Forms ---------- */
.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px 24px}
.form-grid .full{grid-column:1/-1}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:13px;font-weight:600;color:#3a3a36}
.field label .req{color:var(--danger)}
.field .hint{font-size:12px;color:var(--muted)}
.field input,.field select,.field textarea{
  padding:11px 14px;border:1px solid var(--line-strong);border-radius:10px;background:var(--surface);
  font-size:14px;transition:border-color var(--t-fast),box-shadow var(--t-fast),background var(--t-fast);
  width:100%;outline:0;
}
.field input:focus,.field select:focus,.field textarea:focus{
  border-color:var(--primary);box-shadow:0 0 0 3px rgba(45,74,62,.12);
}
.field.error input,.field.error select,.field.error textarea{
  border-color:var(--danger);background:#FCF5F4;
}
.field.error .err{color:var(--danger);font-size:12px;display:flex;align-items:center;gap:5px}
.field .err{display:none}
.field.error .err{display:flex}
.field select:disabled,.field input:disabled{background:#F1EFEB;color:var(--muted);cursor:not-allowed}
.form-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:24px;padding-top:20px;border-top:1px solid var(--line)}
.form-section-title{font-size:14px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:8px 0 4px;grid-column:1/-1}

/* ---------- Modal ---------- */
.modal-mask{
  position:fixed;inset:0;background:rgba(20,20,18,.55);backdrop-filter:blur(3px);
  display:flex;align-items:center;justify-content:center;z-index:200;
  opacity:0;pointer-events:none;transition:opacity var(--t-base);
}
.modal-mask.open{opacity:1;pointer-events:auto}
.modal{
  background:var(--surface);border-radius:var(--radius-lg);max-width:480px;width:calc(100% - 32px);
  padding:28px;box-shadow:var(--shadow-lg);transform:translateY(8px);transition:transform var(--t-base);
}
.modal-mask.open .modal{transform:translateY(0)}
.modal h3{font-size:20px;font-weight:700;margin-bottom:6px;letter-spacing:-.01em}
.modal .subtitle{color:var(--muted);font-size:14px;margin-bottom:18px}
.modal .data-block{
  background:var(--bg);border-radius:10px;padding:14px 16px;font-size:13px;margin-bottom:18px;
  border:1px solid var(--line);
}
.modal .data-block div{display:flex;justify-content:space-between;padding:4px 0}
.modal .data-block div+div{border-top:1px dashed var(--line)}
.modal .data-block span:first-child{color:var(--muted);font-weight:500}
.modal .data-block span:last-child{font-weight:600;text-align:right}
.modal .confirm-text{font-size:14px;margin-bottom:20px;color:#3a3a36}
.modal .actions{display:flex;gap:10px;justify-content:flex-end}

/* ---------- Login ---------- */
.login-page{min-height:calc(100vh - 36px);display:grid;grid-template-columns:1fr 1fr}
.login-aside{
  background:linear-gradient(160deg,var(--primary) 0%, #1F3528 100%);color:#fff;
  padding:48px;display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden;
}
.login-aside::after{
  content:"";position:absolute;bottom:-80px;right:-80px;width:320px;height:320px;
  background:radial-gradient(circle,rgba(168,192,154,.25),transparent 60%);
}
.login-aside .brand-name{color:#fff;font-size:22px}
.login-aside .brand-name .accent{color:var(--soft)}
.login-aside h1{font-size:42px;font-weight:700;letter-spacing:-.02em;line-height:1.1;margin-bottom:12px;position:relative}
.login-aside p{opacity:.8;max-width:380px;font-size:15px;line-height:1.6;position:relative}
.login-aside .features{display:grid;gap:14px;margin-top:32px;position:relative}
.login-aside .feature{display:flex;gap:12px;align-items:flex-start}
.login-aside .feature .dot{width:32px;height:32px;border-radius:50%;background:rgba(255,255,255,.12);display:inline-flex;align-items:center;justify-content:center;flex-shrink:0}
.login-aside .feature .txt{font-size:14px;opacity:.95;line-height:1.45}
.login-aside .foot{font-size:12px;opacity:.6;position:relative}
.login-main{padding:48px;display:flex;align-items:center;justify-content:center;background:var(--bg)}
.login-card{max-width:380px;width:100%}
.login-card h2{font-size:30px;font-weight:700;letter-spacing:-.015em;margin-bottom:8px}
.login-card .sub{color:var(--muted);margin-bottom:32px;font-size:14px}
.login-form{display:flex;flex-direction:column;gap:16px}
.login-error{
  background:var(--danger-100);color:var(--danger);padding:12px 14px;border-radius:10px;font-size:13px;
  display:flex;align-items:center;gap:8px;font-weight:500;
}
.login-tips{
  background:var(--surface);border:1px dashed var(--line-strong);border-radius:12px;
  padding:14px 16px;margin-top:24px;font-size:12px;color:var(--muted);
}
.login-tips strong{color:var(--ink);font-weight:600;display:block;margin-bottom:6px;font-size:11px;letter-spacing:.08em;text-transform:uppercase}
.login-tips code{background:var(--bg);padding:2px 6px;border-radius:5px;font-size:11px;font-family:'Inter',monospace}

/* ---------- 404 ---------- */
.notfound{
  min-height:calc(100vh - 36px);display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;padding:48px;
}
.notfound .code{font-size:120px;font-weight:800;color:var(--primary);letter-spacing:-.04em;line-height:1}
.notfound h2{font-size:28px;font-weight:700;margin:6px 0 8px}
.notfound p{color:var(--muted);max-width:380px;margin-bottom:24px}

/* ---------- Checador / Registro visitante ---------- */
.checador-wrap{max-width:560px;margin:0 auto}
.code-input-big{
  font-size:28px;letter-spacing:.4em;text-align:center;font-weight:700;
  font-family:'Inter',monospace;text-transform:uppercase;
}
.visitor-preview{
  background:linear-gradient(145deg,var(--primary-50) 0%, rgba(168,192,154,.25) 100%);
  border:1px solid var(--primary-100);border-radius:var(--radius-lg);padding:24px;margin-top:24px;
}
.visitor-preview .row{display:flex;justify-content:space-between;padding:8px 0;font-size:14px;border-bottom:1px dashed rgba(45,74,62,.18)}
.visitor-preview .row:last-child{border-bottom:0}
.visitor-preview .row span:first-child{color:var(--primary-700);font-weight:500}
.visitor-preview .row span:last-child{font-weight:600;color:var(--ink)}
.status-badge{
  display:inline-flex;align-items:center;gap:8px;padding:8px 14px;border-radius:999px;
  background:var(--success-100);color:var(--success);font-size:13px;font-weight:600;margin-top:8px;
}

/* ---------- Responsive ---------- */
@media (max-width:1024px){
  .layout{grid-template-columns:72px 1fr}
  .sidebar .nav-item span,.sidebar .nav-section,.sidebar .user-meta,.sidebar .logout-btn span{display:none}
  .sidebar{padding:16px 8px}
  .brand-name{display:none}
  .brand{justify-content:center}
  .form-grid{grid-template-columns:1fr}
  .login-page{grid-template-columns:1fr}
  .login-aside{display:none}
}
@media (max-width:680px){
  .content{padding:20px 16px 48px}
  .topbar{padding:12px 16px}
  .home-cards{grid-template-columns:1fr}
  .welcome-strip{padding:20px}
  .demo-bar{font-size:11px;gap:8px;flex-wrap:wrap}
}
</style>
</head>
<body>

<!-- ============================================================
     DEMO BAR (solo prototipo — permite cambiar de perfil)
     ============================================================ -->
<div class="demo-bar" id="demoBar">
  <span class="label">Prototipo demo</span>
  <span style="opacity:.4">·</span>
  <span style="opacity:.7">Perfil activo:</span>
  <div class="role-switch" id="roleSwitch">
    <button data-role="Administrador" class="active">Administrador</button>
    <button data-role="Inquilino">Inquilino</button>
    <button data-role="Vigilante">Vigilante</button>
  </div>
  <div class="right">
    <span>UHabitacional · v0.1 · <a href="#/login" style="color:#fff;text-decoration:underline;opacity:.8">Login</a></span>
  </div>
</div>

<!-- ============================================================
     APP SHELL
     ============================================================ -->
<div id="app"></div>

<!-- ============================================================
     LOGO + ICONOS (definidos como template strings)
     ============================================================ -->
<script>
/* ===== Brand mark (Bloques Residenciales) ===== */
const LOGO_SVG = (size=36) => `
<svg width="${size}" height="${size}" viewBox="0 0 56 56" xmlns="http://www.w3.org/2000/svg">
  <rect x="2"  y="32" width="16" height="22" rx="2" fill="#2D4A3E"/>
  <rect x="20" y="20" width="16" height="34" rx="2" fill="#CB6843"/>
  <rect x="38" y="8"  width="16" height="46" rx="2" fill="#1A1A1A"/>

<script>
const $ = (sel,ctx=document)=>ctx.querySelector(sel);
const $$ = (sel,ctx=document)=>Array.from(ctx.querySelectorAll(sel));

function navigate(hash){ location.hash = hash; }

function shell(content, {sidebar=true, breadcrumb=[], pageTitle=''}={}){
  if(!sidebar){
    return `<div class="layout no-sidebar">${content}</div>`;
  }
  return `
    <div class="layout">
      ${renderSidebar()}
      <div>
        ${renderTopbar(breadcrumb)}
        <main class="content">${content}</main>
      </div>
    </div>
    <div id="modalRoot"></div>
  `;
}

function renderSidebar(){
  const role = STATE.role;
  const items = [];
  items.push({route:'#/home', label:'Home', icon:I.home, roles:['Administrador','Inquilino','Vigilante']});
  if(role==='Administrador'){
    items.push({route:'#/vigilantes',       label:'Vigilantes',         icon:I.shield});
    items.push({route:'#/inquilinos',       label:'Inquilinos',         icon:I.users});
    items.push({route:'#/departamentos',    label:'Departamentos',      icon:I.door});
    items.push({route:'#/edificios',        label:'Edificios',          icon:I.building});
    items.push({route:'#/perfiles',         label:'Perfiles',           icon:I.badge});
    items.push({route:'#/identificaciones', label:'Identificaciones',   icon:I.idcard});
  }
  if(role==='Inquilino'){
    items.push({route:'#/visitantes',       label:'Mis visitantes',     icon:I.user_plus});
  }
  if(role==='Vigilante'){
    items.push({route:'#/checador',         label:'Checador',           icon:I.clock});
    items.push({route:'#/registro-visitante',label:'Registro visitante',icon:I.scan});
  }

  const here = location.hash || '#/home';
  const active = (r)=> here===r || here.startsWith(r+'/') ? 'active' : '';

  return `
    <aside class="sidebar">
      <div class="brand">
        <span class="brand-mark">${LOGO_SVG(34)}</span>
        <span class="brand-name">U<span class="accent">Habitacional</span></span>
      </div>
      <div class="nav-section">Menú</div>
      ${items.map(it=>`
        <a class="nav-item ${active(it.route)}" href="${it.route}">
          ${it.icon}<span>${it.label}</span>
        </a>
      `).join('')}

      <div class="sidebar-foot">
        <div class="user-chip">
          <div class="avatar">${STATE.user.nombre.split(' ').map(p=>p[0]).slice(0,2).join('')}</div>
          <div class="user-meta">
            <div style="font-weight:600">${STATE.user.nombre.split(' ').slice(0,2).join(' ')}</div>
            <small>${STATE.role}</small>
          </div>
        </div>
        <button class="logout-btn" onclick="navigate('#/login')">
          ${I.logout}<span>Cerrar sesión</span>
        </button>
      </div>
    </aside>
  `;
}

function renderTopbar(crumbs){
  const parts = crumbs.map((c,i)=>{
    const isLast = i===crumbs.length-1;
    return `
      ${i>0?'<span class="sep">›</span>':''}
      <span class="crumb ${isLast?'current':'link'}" ${c.route&&!isLast?`onclick="navigate('${c.route}')"`:''}>${c.label}</span>
    `;
  }).join('');
  return `
    <header class="topbar">
      <nav class="breadcrumb">${parts}</nav>
      <div class="topbar-actions">
        <button class="icon-btn" title="Notificaciones">${I.bell}</button>
        <button class="btn btn-ghost btn-sm" onclick="navigate('#/login')">${I.logout}<span>Cerrar sesión</span></button>
      </div>
    </header>
  `;
}

/* ===================== Routes ===================== */
const ROUTES = {
  '#/login': ()=>renderLogin(),
  '#/home': ()=>renderHome(),
  '#/404': ()=>render404(),

  '#/vigilantes': ()=>renderListVigilantes(),
  '#/vigilantes/nuevo': ()=>renderFormVigilante(),
  '#/vigilantes/editar': ()=>renderFormVigilante('VG-001'),

  '#/inquilinos': ()=>renderListInquilinos(),
  '#/inquilinos/nuevo': ()=>renderFormInquilino(),
  '#/inquilinos/editar': ()=>renderFormInquilino('IN-001'),

  '#/departamentos': ()=>renderListDepartamentos(),
  '#/departamentos/nuevo': ()=>renderFormDepartamento(),
  '#/departamentos/editar': ()=>renderFormDepartamento('DP-001'),

  '#/edificios': ()=>renderListEdificios(),
  '#/edificios/nuevo': ()=>renderFormEdificio(),
  '#/edificios/editar': ()=>renderFormEdificio('ED-001'),

  '#/perfiles': ()=>renderListPerfiles(),
  '#/perfiles/nuevo': ()=>renderFormPerfil(),
  '#/perfiles/editar': ()=>renderFormPerfil('PF-01'),

  '#/identificaciones': ()=>renderListIdentificaciones(),
  '#/identificaciones/nuevo': ()=>renderFormIdentificacion(),
  '#/identificaciones/editar': ()=>renderFormIdentificacion('TI-01'),

  '#/visitantes': ()=>renderListVisitantes(),
  '#/visitantes/nuevo': ()=>renderFormVisitante(),
  '#/visitantes/editar': ()=>renderFormVisitante('VS-001'),

  '#/checador': ()=>renderChecador(),
  '#/registro-visitante': ()=>renderRegistroVisitante(),
};

function router(){
  const hash = location.hash || '#/login';

  // Default by role on home
  let route = hash;
  const fn = ROUTES[route];
  const app = $('#app');

  if(!fn){
    app.innerHTML = shell(render404Inner(), {sidebar:false});
    return;
  }
  if(route==='#/login' || route==='#/404'){
    app.innerHTML = fn();
  }else{
    app.innerHTML = fn();
  }
  window.scrollTo(0,0);
}

window.addEventListener('hashchange', router);
window.addEventListener('DOMContentLoaded', ()=>{
  // role switcher
  $$('#roleSwitch button').forEach(b=>{
    b.addEventListener('click',()=>{
      $$('#roleSwitch button').forEach(x=>x.classList.remove('active'));
      b.classList.add('active');
      STATE.role = b.dataset.role;
      navigate('#/home');
      router();
    });
  });
  if(!location.hash) location.hash = '#/login';
  router();
});
</script>

function renderFormInquilino(id){

  // Edificios con departamentos disponibles
  const edificiosOptions = DATA.edificios.map(e=>`<option value="${e.nombre}" ${v.edificio===e.nombre?'selected':''}>${e.nombre}</option>`).join('');

  setTimeout(()=>{
    wireFormDemo('#frmInquilino');
    // Smart selects: edificio -> deptos
    const edSel = $('#frmInquilino select[name=edificio]');
    const dpSel = $('#frmInquilino select[name=departamento]');
    function refreshDeptos(){
      const eName = edSel.value;
      if(!eName){
        dpSel.innerHTML='<option value="">Selecciona primero un edificio</option>';
        dpSel.disabled = true;
        return;
      }
      let list = DATA.departamentos.filter(d=>d.edificio===eName && d.estado==='Disponible');
      // Si edita, agregar el actual aunque esté ocupado
      if(isEdit){
        const cur = DATA.departamentos.find(d=>d.interior===v.depto && d.edificio===v.edificio);
        if(cur && !list.find(x=>x.id===cur.id)) list.unshift(cur);
      }
      dpSel.innerHTML = '<option value="">Selecciona un departamento</option>' +
        list.map(d=>`<option value="${d.interior}" ${v.depto===d.interior?'selected':''}>${d.interior} · Piso ${d.piso} · ${d.recamaras} rec.</option>`).join('');
      dpSel.disabled = false;
    }
    edSel.addEventListener('change', refreshDeptos);
    refreshDeptos();
  },0);

  return shell(`
    <div class="page-header">
      <div>
        <div class="page-title">${isEdit?'Editar inquilino':'Nuevo inquilino'}</div>
        <div class="page-subtitle">${isEdit?'Actualiza los datos del inquilino y su asignación de departamento.':'Captura los datos del nuevo residente y asígnale un departamento.'}</div>

    </div>

        <div class="form-grid">
          <div class="form-section-title">Datos personales</div>
          <div class="field" data-required>
            <label>Nombre(s) <span class="req">*</span></label>
            <input name="nombre" value="${isEdit?v.nombre.split(' ')[0]:''}" placeholder="Ej. María Fernanda" />
            <span class="err">${I.alert} El campo 'Nombre' es requerido.</span>
          </div>
          <div class="field" data-required>
            <label>Apellido paterno <span class="req">*</span></label>
            <input name="apaterno" value="${isEdit?v.nombre.split(' ')[1]||'':''}" placeholder="Ej. López" />
            <span class="err">${I.alert} El campo 'Apellido paterno' es requerido.</span>
          </div>
          <div class="field">
            <label>Apellido materno</label>
            <input name="amaterno" value="${isEdit?v.nombre.split(' ')[2]||'':''}" />
          </div>
          <div class="field" data-required>
            <label>Teléfono <span class="req">*</span></label>
            <input name="telefono" value="${v.telefono||''}" placeholder="55 9876 5432" />
            <span class="err">${I.alert} El campo 'Teléfono' es requerido.</span>
          </div>

          <div class="form-section-title">Acceso al sistema</div>
          <div class="field" data-required>
            <label>Correo electrónico <span class="req">*</span></label>
            <input type="email" name="correo" value="${v.correo||''}" placeholder="correo@dominio.com" />
            <span class="err">${I.alert} El campo 'Correo' es requerido.</span>
          </div>
          ${!isEdit?`
          <div class="field" data-required>
            <label>Contraseña inicial <span class="req">*</span></label>
            <input name="password" type="password" placeholder="Mínimo 8 caracteres" />
            <span class="err">${I.alert} El campo 'Contraseña' es requerido.</span>
          </div>`:''}

          <div class="form-section-title">Asignación de departamento</div>
          <div class="field" data-required>
            <label>Edificio <span class="req">*</span></label>
            <select name="edificio">
              <option value="">Selecciona un edificio</option>
              ${edificiosOptions}
            </select>
            <span class="hint">Solo se listan edificios con departamentos disponibles.</span>
            <span class="err">${I.alert} El campo 'Edificio' es requerido.</span>
          </div>
          <div class="field" data-required>
            <label>Departamento <span class="req">*</span></label>
            <select name="departamento" disabled>
              <option value="">Selecciona primero un edificio</option>

            <span class="hint">Solo se listan departamentos disponibles (sin inquilino activo).</span>
            <span class="err">${I.alert} El campo 'Departamento' es requerido.</span>
          </div>
          <div class="field">
            <label>Estatus</label>
            <select name="activo">
              <option value="1" ${v.activo?'selected':''}>Activo</option>
              <option value="0" ${!v.activo?'selected':''}>Inactivo</option>
            </select>
          </div>
        </div>

        <div class="form-actions">
          <button type="button" class="btn btn-ghost" onclick="navigate('#/home')">Cancelar</button>
          <button type="submit" class="btn btn-primary">${I.check}<span>${isEdit?'Guardar cambios':'Guardar y crear'}</span></button>
        </div>
      </form>

    {label:'Home',route:'#/home'},
    {label:'Administración de inquilinos',route:'#/inquilinos'},

function renderFormDepartamento(id){
  const isEdit = !!id;
  const d = isEdit ? DATA.departamentos.find(x=>x.id===id) : {edificio:'',piso:'',interior:'',recamaras:'',banos:'',estado:'Disponible'};

  const edsDisponibles = DATA.edificios.filter(e=>e.ocupados < e.capacidad);
  const edificiosOptions = edsDisponibles.map(e=>`<option value="${e.nombre}" data-pisos="${e.pisos}" ${d.edificio===e.nombre?'selected':''}>${e.nombre} (${e.capacidad-e.ocupados} disponibles)</option>`).join('');

  setTimeout(()=>{
    wireFormDemo('#frmDepto');
    const edSel = $('#frmDepto select[name=edificio]');
    const pSel  = $('#frmDepto select[name=piso]');
    function refreshPisos(){
      const opt = edSel.options[edSel.selectedIndex];
      const pisos = opt?Number(opt.dataset.pisos||0):0;
      if(!pisos){ pSel.innerHTML='<option value="">Selecciona primero un edificio</option>'; pSel.disabled=true; return; }
      pSel.innerHTML='<option value="">Selecciona un piso</option>' +
        Array.from({length:pisos},(_,i)=>i+1).map(n=>`<option value="${n}" ${String(d.piso)===String(n)?'selected':''}>Piso ${n}</option>`).join('');
      pSel.disabled=false;
    }
    edSel.addEventListener('change', refreshPisos);
    refreshPisos();
  },0);

  return shell(`
    <div class="page-header">
      <div>
        <div class="page-title">${isEdit?'Editar departamento':'Nuevo departamento'}</div>
        <div class="page-subtitle">${isEdit?'Actualiza los datos del departamento seleccionado.':'Da de alta un nuevo departamento dentro de un edificio.'}</div>

          <div class="field" data-required>
            <label>Edificio <span class="req">*</span></label>
            <select name="edificio">
              <option value="">Selecciona un edificio</option>
              ${edificiosOptions}
            </select>
            <span class="hint">Solo se listan edificios con capacidad disponible.</span>
            <span class="err">${I.alert} El campo 'Edificio' es requerido.</span>
          </div>
          <div class="field" data-required>
            <label>Piso <span class="req">*</span></label>
            <select name="piso" disabled><option value="">Selecciona primero un edificio</option></select>
            <span class="err">${I.alert} El campo 'Piso' es requerido.</span>
          </div>
          <div class="field" data-required>
            <label>Número interior <span class="req">*</span></label>
            <input name="interior" value="${d.interior||''}" placeholder="Ej. A-301" />
            <span class="err">${I.alert} El campo 'Número interior' es requerido.</span>
          </div>

          <div class="form-section-title">Detalle del departamento</div>
          <div class="field" data-required>
            <label>Recámaras <span class="req">*</span></label>
            <input type="number" min="1" max="6" name="recamaras" value="${d.recamaras||''}" placeholder="1-6" />
            <span class="err">${I.alert} El campo 'Recámaras' es requerido.</span>
          </div>
          <div class="field" data-required>
            <label>Baños <span class="req">*</span></label>
            <input type="number" min="1" max="5" name="banos" value="${d.banos||''}" placeholder="1-5" />
            <span class="err">${I.alert} El campo 'Baños' es requerido.</span>
          </div>
          <div class="field">
            <label>Estado</label>
            <select name="estado">
              <option ${d.estado==='Disponible'?'selected':''}>Disponible</option>
              <option ${d.estado==='Ocupado'?'selected':''}>Ocupado</option>
            </select>
          </div>

/* ============ CHECADOR (Vigilante) ============ */
function renderChecador(){
  const ahora = new Date();
  const fechaStr = ahora.toLocaleDateString('es-MX',{weekday:'long',day:'2-digit',month:'long',year:'numeric'});
  const horaStr  = ahora.toLocaleTimeString('es-MX',{hour:'2-digit',minute:'2-digit'});

  setTimeout(()=>{
    const btnIn  = $('#btnCheckIn');
    const btnOut = $('#btnCheckOut');
    const status = $('#checadorStatus');
    if(btnIn) btnIn.addEventListener('click',()=>{
      btnIn.disabled = true; btnIn.style.opacity=.4;
      btnOut.disabled = false;
      status.innerHTML = `<div class="status-badge">${I.check}<span>Entrada registrada · ${horaStr}</span></div>`;
    });
    if(btnOut) btnOut.addEventListener('click',()=>{
      btnOut.disabled = true; btnOut.style.opacity=.4;
      status.innerHTML = `<div class="status-badge" style="background:var(--accent-100);color:var(--accent-700)">${I.check}<span>Salida registrada · ${horaStr}</span></div>`;
    });
  },0);

  return shell(`
    <div class="page-header">
      <div>
        <div class="page-title">Checador de turno</div>
        <div class="page-subtitle">Registra tu entrada y salida del turno.</div>
      </div>
    </div>

    <div class="checador-wrap">
      <div class="card flat" style="text-align:center;padding:40px 32px">
        <div style="font-size:13px;color:var(--muted);text-transform:capitalize">${fechaStr}</div>
        <div style="font-family:'Inter',monospace;font-size:64px;font-weight:700;letter-spacing:-.02em;color:var(--primary);margin:6px 0 24px">${horaStr}</div>

        <div style="font-size:14px;color:var(--muted);margin-bottom:20px">Vigilante: <strong style="color:var(--ink)">${STATE.user.nombre}</strong> · Turno asignado: <strong style="color:var(--ink)">Matutino</strong></div>

/* ============ REGISTRO ENTRADA / SALIDA VISITANTE ============ */
function renderRegistroVisitante(){
  setTimeout(()=>{
    const form = $('#frmValidaCodigo');
    const wrap = $('#visitorWrap');
    const errBox = $('#codigoErr');
    if(!form) return;

    form.addEventListener('submit', e=>{
      e.preventDefault();
      const code = form.codigo.value.trim().toUpperCase();
      const v = DATA.visitantes.find(x=>x.codigo===code);
      if(!v){
        wrap.innerHTML='';
        errBox.style.display='flex';
        return;
      }
      errBox.style.display='none';
      const tieneEntrada = !!v.entrada;
      const tieneSalida  = !!v.salida;
      const inq = DATA.inquilinos.find(i=>i.id==='IN-001'); // demo

      wrap.innerHTML = `
        <div class="visitor-preview">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
            <div style="font-weight:700;font-size:18px;color:var(--primary-700)">Visitante validado</div>
            <span class="pill pill-success">${I.check} Código válido</span>
          </div>
          <div class="row"><span>Visitante</span><span>${v.nombre}</span></div>
          <div class="row"><span>Identificación</span><span>${v.identificacion} · ${v.numIdent}</span></div>
          <div class="row"><span>Motivo</span><span>${v.motivo}</span></div>
          <div class="row"><span>Inquilino que invita</span><span>${inq.nombre}</span></div>
          <div class="row"><span>Departamento</span><span>${inq.edificio} · ${inq.depto}</span></div>
          <div class="row"><span>Código de visita</span><span><code style="background:#fff;padding:3px 8px;border-radius:6px;font-family:'Inter',monospace;color:var(--primary);font-weight:700">${v.codigo}</code></span></div>
          ${tieneEntrada?`<div class="row"><span>Hora de entrada</span><span>${v.entrada}</span></div>`:''}
          ${tieneSalida?`<div class="row"><span>Hora de salida</span><span>${v.salida}</span></div>`:''}
        </div>

        <div style="display:flex;gap:12px;margin-top:18px;justify-content:flex-end;flex-wrap:wrap">
          ${!tieneEntrada?`<button class="btn btn-primary" onclick="registrarEntrada('${v.id}')">${I.check}<span>Registrar entrada</span></button>`:''}
          ${tieneEntrada && !tieneSalida?`<button class="btn btn-accent" onclick="registrarSalida('${v.id}')">${I.logout}<span>Registrar salida</span></button>`:''}
          ${tieneEntrada && tieneSalida?`<div class="status-badge">${I.check} Visita completada</div>`:''}
        </div>
      `;
    });
  },0);

  return shell(`
    <div class="page-header">
      <div>
        <div class="page-title">Registro entrada / salida de visitante</div>
        <div class="page-subtitle">Solicita al visitante su Código de visita y valídalo para registrar su acceso.</div>
      </div>
    </div>

    <div class="checador-wrap">
      <div class="card flat">
        <form id="frmValidaCodigo" novalidate>
          <div class="field">
            <label>Código de visita</label>
            <input class="code-input-big" name="codigo" placeholder="UH-XXXX-XX" maxlength="11" required />
            <span class="hint" style="text-align:center;margin-top:8px">Prueba con uno de los códigos demo: <strong>UH-2K8F-9X</strong> (sin entrada), <strong>UH-7M3L-2R</strong> (con entrada y salida), <strong>UH-4P9V-1B</strong>.</span>
          </div>
          <div id="codigoErr" class="login-error" style="display:none;margin-top:14px">
            ${I.alert}<span>El código no existe o no está activo. Verifica con el visitante.</span>
          </div>
          <div style="display:flex;justify-content:center;margin-top:18px">
            <button type="submit" class="btn btn-primary" style="padding:13px 28px">${I.scan}<span>Validar código</span></button>
          </div>
        </form>

        <div id="visitorWrap"></div>
      </div>
    </div>
  `, {breadcrumb:[{label:'Home',route:'#/home'},{label:'Registro de visitante'}]});
}

function registrarEntrada(id){
  const v = DATA.visitantes.find(x=>x.id===id);
  if(!v) return;
  v.entrada = new Date().toISOString().slice(0,16).replace('T',' ');
  router();
  // Re-validar visualmente
  setTimeout(()=>{
    const form = $('#frmValidaCodigo');
    if(form){ form.codigo.value=v.codigo; form.dispatchEvent(new Event('submit')); }
  },50);
}
function registrarSalida(id){
  const v = DATA.visitantes.find(x=>x.id===id);
  if(!v) return;
  v.salida = new Date().toISOString().slice(0,16).replace('T',' ');
  router();
  setTimeout(()=>{
    const form = $('#frmValidaCodigo');
    if(form){ form.codigo.value=v.codigo; form.dispatchEvent(new Event('submit')); }
  },50);
}
</script>

<script>
function openDeleteModal(tipo, info){
  const labels = {
    vigilante:'vigilante', inquilino:'inquilino', perfil:'tipo de usuario',
    identificacion:'tipo de identificación', visitante:'visitante'
  };
  const titles = {
    vigilante:'Eliminar vigilante', inquilino:'Eliminar inquilino', perfil:'Eliminar perfil',
    identificacion:'Eliminar tipo de identificación', visitante:'Eliminar visitante'
  };
  const root = $('#modalRoot');
  root.innerHTML = `
    <div class="modal-mask open" id="modalMask">
      <div class="modal" role="dialog" aria-modal="true">
        <h3>${titles[tipo]}</h3>
        <p class="subtitle">Esta acción no se puede deshacer.</p>
        <div class="data-block">
          <div><span>ID</span><span>${info.id}</span></div>
          <div><span>Nombre completo</span><span>${info.nombre}</span></div>
          ${info.correo?`<div><span>Correo</span><span>${info.correo}</span></div>`:''}
        </div>
        <p class="confirm-text">¿Está seguro que desea eliminar este ${labels[tipo]}?</p>
        <div class="actions">
          <button class="btn btn-ghost" onclick="closeModal()">Cancelar</button>
          <button class="btn btn-danger" onclick="confirmDelete('${tipo}','${info.id}')">${I.trash}<span>Aceptar</span></button>
        </div>
      </div>
    </div>
  `;
}
function closeModal(){
  const m = $('#modalMask');
  if(m){ m.classList.remove('open'); setTimeout(()=>m.remove(),200) }
}
function confirmDelete(tipo,id){
  // Demo: feedback visual y cerramos
  closeModal();
  showToast(`${tipo[0].toUpperCase()+tipo.slice(1)} ${id} eliminado correctamente`);
  setTimeout(()=>router(),300);
}
function showToast(msg){
  const t = document.createElement('div');
  t.style.cssText = 'position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--success);color:#fff;padding:12px 20px;border-radius:10px;font-size:14px;font-weight:600;z-index:300;box-shadow:0 12px 30px -10px rgba(0,0,0,.3);display:flex;align-items:center;gap:8px';
  t.innerHTML = I.check+'<span>'+msg+'</span>';
  document.body.appendChild(t);
  setTimeout(()=>{t.style.opacity=0;t.style.transition='opacity .3s'},2400);
  setTimeout(()=>t.remove(),2800);
}

/* ===== Validación inline de formularios (demo) ===== */
function wireFormDemo(formSel){
  const form = $(formSel);
  if(!form) return;
  form.addEventListener('submit', e=>{
    e.preventDefault();
    let ok = true;
    form.querySelectorAll('.field[data-required]').forEach(f=>{
      const input = f.querySelector('input,select,textarea');
      if(!input) return;
      if(!input.value || input.value==='' || (input.type==='email' && !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(input.value))){
        f.classList.add('error'); ok = false;
      }else{
        f.classList.remove('error');
      }
    });
    if(ok){
      showToast('Registro guardado correctamente');
      setTimeout(()=>history.back(),700);
    }else{
      // Scroll al primer error
      const firstErr = form.querySelector('.field.error');
      if(firstErr) firstErr.scrollIntoView({behavior:'smooth',block:'center'});
    }
  });
  // limpiar error al teclear
  form.addEventListener('input', e=>{
    const f = e.target.closest('.field');
    if(f) f.classList.remove('error');
  });
}
</script>
